<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#152238;font:14px "Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #cdd5e0;padding:12px 18px}#title{font-size:16px;font-weight:600;overflow-wrap:anywhere}#status{font-size:12px;color:#58677d;margin-top:6px}#tabs{display:flex;gap:6px;overflow:auto;padding-top:6px}button{border:1px solid #cad4e4;border-radius:6px;background:#fff;padding:6px 12px;cursor:pointer}button.active{background:#145cce;color:#fff}#view{padding:16px;overflow:auto}.error{padding:24px;background:white;color:#9c2330;border-radius:10px}.docx-wrapper{padding:12px!important;background:#eef1f5!important}.docx{max-width:100%;margin:auto!important}.sheet-wrap{max-height:calc(100vh - 125px);overflow:auto;background:#fff;border:1px solid #cbd3df}.sheet{border-collapse:separate;border-spacing:0;font-size:12px}.sheet td,.sheet th{border-right:1px solid #dce2eb;border-bottom:1px solid #dce2eb;padding:5px 8px;max-width:500px;overflow:hidden}.sheet th{background:#eaf0f8;color:#4d5e74;position:sticky;left:0;z-index:1}.sheet thead th{top:0;z-index:3}.slide-section{max-width:1000px;margin:0 auto 24px}.slide-section h2{font-size:13px;color:#52657e}.slide{position:relative;background:white;box-shadow:0 2px 10px #0002;overflow:hidden;container-type:inline-size}.shape{position:absolute;overflow:hidden;font-size:clamp(9px,2cqw,24px)}.shape p{margin:0;white-space:pre-wrap}.shape img{width:100%;height:100%;object-fit:contain}
</style></head><body><header><div id="title">Office Preview · Tiếng Việt</div><label style="display:inline-block;margin-top:8px">Chọn tài liệu <input id="picker" type="file" accept=".docx,.xlsx,.pptx"></label><div id="status">Đang kết nối…</div><nav id="tabs"></nav></header><main id="view"></main><script>window.addEventListener("error",function(e){document.getElementById("status").textContent="Lỗi khởi động: "+e.message});window.addEventListener("unhandledrejection",function(e){document.getElementById("status").textContent="Lỗi xử lý: "+String(e.reason)});document.getElementById("status").textContent="Đang khởi tạo trình xem…";</script><script type="module">/* OFFICE-BUNDLE */</script></body></html>
